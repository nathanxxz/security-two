<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="utf-8"><title>Login - Banco Exemplo</title></head>
<body>
  <h1>Banco Exemplo - Acesso</h1>
  {% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Usuario: <input name="usuario"></label><br>
    <label>Senha: <input name="senha" type="password"></label><br>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
